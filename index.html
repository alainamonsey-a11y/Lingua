:root{
  --paper:#F3F0E8; --paper-2:#EAE6DB; --ink:#1C1B18; --ink-2:#55524A; --ink-3:#8C887D; --rule:#CFCABD;
  --red:#A63D2F; --blue:#3C5A7A; --ochre:#B8892B; --green:#4E6B4A; --plum:#6B4A5E;
  --accent:var(--blue);
  --font:"Jost","Futura","Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-weight:500;line-height:1.15;letter-spacing:-.01em}
.sr{position:absolute;left:-9999px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:14px;padding:12px 18px;min-height:52px}
.bar .mark{width:14px;height:14px;background:var(--accent);flex:none}
.bar .mark.circle{border-radius:50%}
.bar .mark.tri{width:0;height:0;background:none;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid var(--accent)}
.bar .crumb{flex:1;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .crumb b{color:var(--ink);font-weight:500}
.bar button{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:6px 0}
.bar button:hover{color:var(--ink)}

.wrap{max-width:860px;margin:0 auto;padding:22px 18px 80px}

/* home */
.homehero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;padding:30px 0 26px;border-bottom:1px solid var(--ink);align-items:start}
.homehero .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.homehero h1{font-size:clamp(44px,6vw,84px);font-weight:500;letter-spacing:-.025em;line-height:.95;margin:8px 0 18px}
.mission{font-family:var(--serif);font-size:19px;line-height:1.55;color:var(--ink);max-width:56ch} .mission .minb{font-family:var(--font);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:8px;border-bottom-color:var(--rule)}
.line{margin:0;padding:26px 28px;background:#fff;border:1px solid var(--rule);border-left:6px solid var(--c);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.line blockquote{font-family:var(--serif);font-size:clamp(20px,2vw,27px);line-height:1.4;letter-spacing:-.01em;font-style:italic;margin:0}
.line figcaption{margin-top:16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)} .line figcaption b{font-weight:500;color:var(--ink-2)} .line figcaption a{text-decoration:underline}
.cvstat.home4{grid-template-columns:repeat(4,1fr);border-top:0;margin:0 0 18px} .cvstat.home4 .cvs .v.big{font-size:34px} .cvstat.home4 .cvs .v.big small{display:block;margin-top:2px}
@media (max-width:1099px){ .cvstat.home4{grid-template-columns:repeat(2,1fr)} .cvstat.home4 .cvs:nth-child(2){border-right:0} .cvstat.home4 .cvs:nth-child(-n+2){border-bottom:1px solid var(--rule)} }

  tagline:"From the alphabet to Homer, Plato, and Thucydides in their own words.",
  lead:"Greek is harder to begin than Latin and easier to love. The alphabet takes a week, the verb takes a year, and then the whole of the oldest literature in Europe opens: Homer, the tragedians, Herodotus, Plato, the Gospels. The spine of this track is Athenaze, a story of an Attic farmer's family in the year of Marathon's grandchildren, read alongside Rouse's A Greek Boy at Home, with the grammar drilled on the app's own tables and the real authors arriving in the second year.",
  pron:[["attic","Reconstructed Attic","The Greek of Pericles as scholars reconstruct it: pitch accent, long and short vowels, η as a long 'eh', φ θ χ aspirated stops. The hardest and the most beautiful."],["lucian","Lucian (Ranieri)","A compromise for the Roman period: stress accent, most vowel distinctions kept, φ θ χ as fricatives. Easy to learn, close to history, used in most living-Greek videos."],["erasmian","Erasmian","The academic pronunciation of most Anglophone classrooms: every letter distinct, accents as stress. Not historical, but what your future teachers will use."],["modern","Modern","How Greeks read Homer today: ι η υ ει οι υι all as 'ee', β as v, stress accent. Living and lovely, hard for spelling."]],
  stages:[

     method:"Write the alphabet by hand until it is automatic. Read every sentence aloud. Athenaze's grammar is in the margins of the story; read the story first. Rouse's Greek Boy is extra easy reading, in Greek only, for the days when Athenaze feels heavy."},

     intro:"The middle of Athenaze I is the Greek verb in all its glory: the aorist, the middle voice, contract verbs, the participle in all three tenses, the imperfect and the future. The story goes to Athens for the festival, to the theatre, to the doctor, and then to Marathon.",
     method:"One chapter a week, no faster. Ten minutes a day on the paradigm drills: the principal parts, the participle, the aorist. Begin writing three sentences of your own Greek a day. Begin the DCC Greek core vocabulary."},

/* Emblems for the two tracks: flat geometry in the track colour, ink, and white. 600x220 box; the main mass in the centre 300px so a square crop works. */
window.HERO=(function(){
  const A="var(--accent)", I="var(--ink)", P="#fff", R="var(--rule)";
  const rect=(x,y,w,h,f,o)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${o?` opacity="${o}"`:""}/>`;
  const circ=(cx,cy,r,f,o)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"${o?` opacity="${o}"`:""}/>`;
  const poly=(pts,f,o)=>`<polygon points="${pts}" fill="${f}"${o?` opacity="${o}"`:""}/>`;
  const arch=(x,y,w,h,f)=>`<path d="M${x} ${y+h} V${y+w/2} A${w/2} ${w/2} 0 0 1 ${x+w} ${y+w/2} V${y+h} Z" fill="${f}"/>`;
  const H={};
  // Latin: a triumphal arch with an inscription band, SPQR-less; the letters of the alphabet as a frieze
  H.lat=circ(470,56,30,A,.9)
    +rect(120,60,360,150,I)+arch(210,110,180,100,P)+rect(120,60,360,34,A)+[...Array(9)].map((_,i)=>rect(150+i*36,70,16,14,P)).join("")
    +rect(140,100,40,110,P,.12)+rect(420,100,40,110,P,.12)+rect(100,206,400,4,I);
  // Greek: a Doric column between two meander bands, under a sun
  H.grc=circ(140,70,34,A,.9)
    +rect(0,30,600,10,I)+[...Array(15)].map((_,i)=>rect(10+i*40,30,20,10,P)).join("")
    +rect(270,70,60,120,I)+[...Array(5)].map((_,i)=>rect(276+i*12,70,4,120,P,.25)).join("")+rect(258,58,84,12,I)+rect(250,190,100,8,I)+rect(240,198,120,8,I)
    +rect(0,190,600,10,A,.35)+rect(0,206,600,4,I);
  // Both: the two emblems side by side, for the app's home
  H.both=H.lat.replace(/<[^>]+>/g,m=>m.replace(/x="(\d+)"/,(a,x)=>`x="${+x-150}"`).replace(/cx="(\d+)"/,(a,x)=>`cx="${+x-150}"`))+H.grc.replace(/<[^>]+>/g,m=>m.replace(/x="(\d+)"/,(a,x)=>`x="${+x+150}"`).replace(/cx="(\d+)"/,(a,x)=>`cx="${+x+150}"`));
  return (id,pal,opts)=>{ let body=H[id]||H.lat; if(pal){ body=body.split("var(--accent)").join("@A@").split("var(--ink)").join("@I@").split("#fff").join("@P@").split("var(--rule)").join("@R@"); body=body.split("@A@").join(pal.A).split("@I@").join(pal.I).split("@P@").join(pal.P).split("@R@").join(pal.R); }
    const vb=opts&&opts.crop?"120 0 360 220":"0 0 600 220"; return `<svg class="hero${opts&&opts.crop?" crop":""}" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${body}</svg>`; };
})();

  const closeList=()=>{ if(list){ out.push(list==="ul"?"</ul>":"</ol>"); list=null; } };
  for(let l of lines){ const t=l.trim(); if(!t){ flush(); closeList(); continue; } let m;
    if((m=t.match(/^(#{1,3})\s+(.*)/))){ flush(); closeList(); out.push("<h3>"+inline(m[2])+"</h3>"); continue; }

    if(/^\|/.test(t)){ flush(); closeList(); const cells=t.split("|").slice(1,-1).map(c=>c.trim()); if(cells.every(c=>/^:?-+:?$/.test(c))) continue; out.push("<div class='mdrow'>"+cells.map(c=>`<span>${inline(c)}</span>`).join("")+"</div>"); continue; }

/* ---------- vocabulary: lexicon + custom words, spaced repetition ---------- */
const WORDS={};
function allWords(lang){ if(WORDS[lang]&&WORDS[lang]._n===Object.keys((tstate(lang).custom||{})).length) return WORDS[lang].list; const seen=new Set(); const list=[]; (LEX[lang]||[]).forEach((e,i)=>{ const [u,l,f,m,p]=e; if(seen.has(l)) return; seen.add(l); list.push({id:lang+":"+i,u,lemma:l,forms:f||"",meaning:m,pos:p||""}); });
  const cu=tstate(lang).custom||{}; Object.keys(cu).forEach(id=>{ const w=cu[id]; if(w.del||seen.has(w.lemma)) return; seen.add(w.lemma); list.push({id,u:w.u||0,lemma:w.lemma,forms:w.forms||"",meaning:w.meaning,pos:w.pos||"",custom:true}); });
  WORDS[lang]={list,_n:Object.keys(cu).length}; return list; }
function wordById(lang,id){ return allWords(lang).find(w=>w.id===id); }
function wordsOfUnit(lang,u){ return allWords(lang).filter(w=>w.u===u); }
function addCustomWord(lang,{lemma,forms,meaning,pos,u}){ const t=tstate(lang); t.custom=t.custom||{}; const id=lang+":c"+now().toString(36); t.custom[id]={lemma:String(lemma).trim(),forms:String(forms||"").trim(),meaning:String(meaning).trim(),pos:pos||"",u:u||0,_t:now()}; delete WORDS[lang]; introduce(lang,id); save(); return id; }
function deck(lang){ return tstate(lang).deck=tstate(lang).deck||{}; }
function card(lang,id){ return deck(lang)[id]; }
function introduce(lang,id){ const d=deck(lang); if(!d[id]){ d[id]={n:0,ef:2.5,iv:0,due:now(),seen:now(),lapses:0,_t:now()}; save(); } return d[id]; }
function rate(lang,id,q){ const c=introduce(lang,id); if(q<3){ c.n=0; c.iv=0; c.lapses=(c.lapses||0)+1; c.due=now()+10*60000; } else { c.n=(c.n||0)+1; c.iv=c.n===1?1:(c.n===2?6:Math.round(c.iv*c.ef)); if(q===5&&c.n>2) c.iv=Math.round(c.iv*1.3); c.ef=Math.max(1.3,(c.ef||2.5)+0.1-(5-q)*(0.08+(5-q)*0.02)); c.due=now()+c.iv*DAY; } c.last=now(); c._t=now(); save(); return c; }
function dueCards(lang){ const d=deck(lang); const t=now(); return Object.keys(d).filter(id=>d[id].due<=t&&wordById(lang,id)).sort((a,b)=>d[a].due-d[b].due); }
function deckStats(lang){ const d=deck(lang); let intro=0,known=0,learning=0,due=0; const t=now(); Object.keys(d).forEach(id=>{ if(!wordById(lang,id)) return; intro++; if(d[id].iv>=21) known++; else learning++; if(d[id].due<=t) due++; }); return {intro,known,learning,due,total:allWords(lang).length}; }
function unitVocabState(lang,u){ const ws=wordsOfUnit(lang,u); const d=deck(lang); const intro=ws.filter(w=>d[w.id]).length; const known=ws.filter(w=>d[w.id]&&d[w.id].iv>=21).length; return {n:ws.length,intro,known}; }
/* answer checking */
function meaningAlts(m){ return String(m).split(/[;,]|\s+or\s+/).map(x=>normEn(x)).filter(Boolean); }
function checkMeaning(user,word){ const u=normEn(user); if(!u) return false; const alts=meaningAlts(word.meaning); if(alts.some(a=>a===u)) return true; if(alts.some(a=>a.length>=4&&(u.includes(a)||a.includes(u)&&u.length>=4))) return true; return alts.some(a=>a.length>=5&&lev(a,u)<=1); }
function checkLemma(user,word,lang){ const L=lang==="grc"?(s=>normGrc(s,strictAccents())):normLat; const u=L(user); if(!u) return false; const target=L(word.lemma.split(/[,(]/)[0]); if(u===target) return true; if(target.length>=6&&lev(u,target)<=1) return true; return false; }
/* session builder */
function buildSession(lang,{unit=null,maxDue=40,maxNew=20}={}){ const q=[]; dueCards(lang).slice(0,maxDue).forEach(id=>q.push({id,isNew:false})); if(unit!=null){ wordsOfUnit(lang,unit).filter(w=>!card(lang,w.id)).slice(0,maxNew).forEach(w=>q.push({id:w.id,isNew:true})); } return q; }

/* ---------- paradigms and drills ---------- */
const CASE_NAMES={nom:"nominative",gen:"genitive",dat:"dative",acc:"accusative",abl:"ablative",voc:"vocative"};
const NUM_NAMES={sg:"singular",pl:"plural"};
const GEN_NAMES={m:"masculine",f:"feminine",n:"neuter","m/f":"masc./fem.","1st":"1st person","2nd":"2nd person","refl.":"reflexive","indef. m/f":"indefinite"};
const MOOD_NAMES={ind:"indicative",subj:"subjunctive",opt:"optative"};
const TENSE_NAMES={pres:"present",impf:"imperfect",fut:"future",perf:"perfect",plup:"pluperfect",futperf:"future perfect",aor:"aorist",aor2:"second aorist"};
const VOICE_NAMES={act:"active",pass:"passive",mid:"middle",mp:"middle/passive"};
function cellLabel(key){ const [m,t,v]=key.split("-"); return `${TENSE_NAMES[t]||t} ${MOOD_NAMES[m]||m} ${VOICE_NAMES[v]||v}`; }
function paradigms(lang){ return PAR[lang]||[]; }
function paradigm(lang,id){ return paradigms(lang).find(p=>p.id===id); }
function cleanForm(f){ return String(f).replace(/\s*\(.*?\)\s*/g," ").replace(/\s+/g," ").trim(); }
function formAlts(f){ const base=cleanForm(f); const alts=[base]; const m=String(f).match(/\(([^)]+)\)/g); if(m) m.forEach(x=>{ const inner=x.slice(1,-1).trim(); if(/^[-]/.test(inner)) return; if(/^(trans|intr)/.test(inner)) return; alts.push(inner.replace(/^=\s*/,"")); }); const n=String(f).match(/^(.*?)\(ν\)$/); if(n){ alts.push(n[1]); alts.push(n[1]+"ν"); } return alts.filter(Boolean); }
function sameForm(user,form,lang){ const N=lang==="grc"?(s=>normGrc(s,strictAccents())):normLat; const u=N(user); if(!u) return false; return formAlts(form).some(a=>N(a)===u); }
/* enumerate (label, form) slots of a paradigm */
function slots(p){ const out=[]; if(p.kind==="verb"){ for(const key of Object.keys(p.cells)){ p.cells[key].forEach((f,i)=>{ if(!f||f==="—") return; out.push({kind:"verb",key,i,form:f,label:`${p.persons[i]} ${cellLabel(key)}`,short:p.persons[i],cell:cellLabel(key)}); }); } return out; }
  const groups=(p.kind==="noun")?{"":p.forms}:p.forms; for(const g of Object.keys(groups)){ const G=groups[g]; for(const num of ["sg","pl"]){ (G[num]||[]).forEach((f,i)=>{ if(!f||f==="—") return; const c=p.cases[i]; out.push({kind:"nominal",g,num,c,i,form:f,label:`${CASE_NAMES[c]} ${NUM_NAMES[num]}${g?" "+(GEN_NAMES[g]||g):""}`}); }); } } return out; }
function drillScope(lang,maxUnit){ return paradigms(lang).filter(p=>(p.unit||1)<=maxUnit); }
function makeItem(lang,p){ const sl=slots(p); if(!sl.length) return null; const s=pick(sl); const N=lang==="grc"?(x=>normGrc(x,false)):normLat; const same=sl.filter(x=>N(cleanForm(x.form))===N(cleanForm(s.form)));
  if(Math.random()<0.5){ return {type:"produce",lang,pid:p.id,pname:p.name,prompt:`Give the <b>${s.label}</b> of <span class="pn">${esc(p.name.split(" (")[0].split(" — ")[0])}</span>`,answer:s.form,alts:formAlts(s.form),labels:same.map(x=>x.label)}; }
  // parse: multiple choice among labels; correct = any label with the same form
  const correct=same.map(x=>x.label); const others=shuffle(sl.filter(x=>!correct.includes(x.label)).map(x=>x.label)); const uniq=[...new Set(others)].slice(0,4); const opts=shuffle([pick(correct),...uniq]);
  return {type:"parse",lang,pid:p.id,pname:p.name,form:cleanForm(s.form),prompt:`Parse this form of <span class="pn">${esc(p.name.split(" (")[0].split(" — ")[0])}</span>`,options:opts,correct}; }
function buildDrill(lang,scopeIds,n=10){ const ps=paradigms(lang).filter(p=>scopeIds.includes(p.id)); if(!ps.length) return []; const items=[]; let guard=0; while(items.length<n&&guard++<200){ const it=makeItem(lang,pick(ps)); if(it) items.push(it); } return items; }
function logDrill(lang,res){ const t=tstate(lang); t.drills=t.drills||[]; t.drills.push(Object.assign({id:now().toString(36),at:now()},res)); if(t.drills.length>400) t.drills=t.drills.slice(-400); save(); }
function drillAccuracy(lang,days=30){ const t=tstate(lang); const cut=now()-days*DAY; const rs=(t.drills||[]).filter(d=>d.at>=cut); const n=rs.reduce((a,d)=>a+d.n,0), c=rs.reduce((a,d)=>a+d.correct,0); return n?Math.round(100*c/n):null; }
/* render a paradigm as tables */
function paradigmHTML(p,lang){ const cls=lang==="grc"?"grc":""; if(p.kind==="verb"){ const keys=Object.keys(p.cells); const order=["ind","subj","opt"]; keys.sort((a,b)=>order.indexOf(a.split("-")[0])-order.indexOf(b.split("-")[0]));
    let h=`<div class="hint" style="margin-bottom:8px">Principal parts: <span class="${cls}" style="font-family:var(--serif);font-size:16px;color:var(--ink)">${p.principal.map(esc).join(", ")}</span></div><div class="cellgrid">`;
    h+=keys.map(k=>`<div class="cell"><div class="k">${esc(cellLabel(k))}</div><ol>${p.cells[k].map((f,i)=>`<li class="${cls}">${esc(f)}<span>${esc(p.persons[i])}</span></li>`).join("")}</ol></div>`).join("");
    const extra=[["Imperative",p.imp],["Infinitives",p.inf],["Participles",p.part]].filter(([l,o])=>o&&Object.keys(o).length);
    h+=extra.map(([l,o])=>`<div class="cell"><div class="k">${l}</div><ol>${Object.keys(o).map(k=>`<li class="${cls}">${esc(o[k])}<span>${esc(k)}</span></li>`).join("")}</ol></div>`).join("")+"</div>"; return h; }
  const groups=p.kind==="noun"?{"":p.forms}:p.forms; const gk=Object.keys(groups);
  return `<div class="parwrap"><table class="par"><thead><tr><th></th>${gk.map(g=>`<th colspan="2">${esc(GEN_NAMES[g]||g||"")}</th>`).join("")}</tr><tr><th></th>${gk.map(()=>`<th>sg</th><th>pl</th>`).join("")}</tr></thead><tbody>${p.cases.map((c,i)=>`<tr><td class="lbl">${esc(CASE_NAMES[c])}</td>${gk.map(g=>`<td class="${cls}">${esc((groups[g].sg||[])[i]||"")}</td><td class="${cls}">${esc((groups[g].pl||[])[i]||"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }

/* ---------- the tutor: prompts and generation ---------- */
const INTENSITY=[["light","light","Short and kind: a few items, the gist, generous marking."],["standard","standard","A proper lesson's worth; marked fairly."],["deep","demanding","Longer, harder, marked as a university course would."]];
function intensity(){ const v=(S.ui||{}).intensity; return INTENSITY.some(x=>x[0]===v)?v:"standard"; }
function setIntensity(v){ S.ui=S.ui||{}; S.ui.intensity=v; S.ui._t=now(); save(); }
const PARTS=[["vocab","Vocabulary"],["grammar","Grammar drills"],["reading","Readings"],["exercises","Exercises"],["compose","Composition"],["converse","Conversation"],["test","Unit tests"]];
function doing(part){ const d=(S.ui||{}).doing; return !d||d[part]!==false; }
function setDoing(part,on){ S.ui=S.ui||{}; S.ui.doing=S.ui.doing||{}; S.ui.doing[part]=!!on; S.ui._t=now(); save(); }
function track(lang){ return TRACKS.find(t=>t.id===lang); }
function unitOf(lang,n){ return track(lang).units[n-1]; }
function stageOf(n){ return Math.ceil(n/10); }
function knownLemmas(lang,limit=320){ const d=deck(lang); const ws=allWords(lang).filter(w=>d[w.id]); ws.sort((a,b)=>(d[b.id].iv||0)-(d[a.id].iv||0)); return ws.slice(0,limit).map(w=>w.lemma.split(/[,(]/)[0].trim()); }
function pronText(lang){ const t=track(lang); const p=t.pron.find(x=>x[0]===pron(lang)); return p?`${p[1]} (${p[2]})`:""; }
function baseSystem(lang){ const t=track(lang); const L=t.name; const greek=lang==="grc";
  return `You are the tutor of ${L} for ${STUDENT}, an adult learner (a high-school engineering teacher with a strong academic background, studying ancient history alongside) who began with no background in the language and intends to reach reading fluency, and as much speaking and writing fluency as the language allows, over several years. You teach ${greek?"Attic Greek with full polytonic accents and breathings; Koine, Ionic, Homeric, and Aeolic forms are introduced only where the unit says so":"classical Latin, writing macrons on long vowels in every Latin word you produce"}. Pronunciation she uses: ${pronText(lang)}.
Method: comprehensible input first; grammar explained plainly when the reading needs it, with examples before rules; every explanation in English with ${L} examples; corrections kind, specific, and brief. Never invent a word: use only real ${L}. Treat her as capable; never flatter. Address her as ${STUDENT} when natural.
Intensity: ${intensity()==="light"?"light. Keep everything short and gentle; a few items; mark generously.":intensity()==="deep"?"demanding. Longer tasks, harder items, marked as a university course would.":"standard. A proper lesson's worth, marked fairly."}`; }
function unitSystem(lang,n){ const t=track(lang); const u=unitOf(lang,n); const st=t.stages[stageOf(n)-1]; const ws=wordsOfUnit(lang,n).map(w=>w.lemma+" — "+w.meaning); const known=knownLemmas(lang);
  return baseSystem(lang)+`\n\nCourse: ${t.name}, six stages of ten units. Stage ${stageOf(n)}: ${st.t} (${st.sub}). ${st.intro}\nCurrent unit: Unit ${n}, "${u.t}".\nGrammar of this unit: ${u.g.join("; ")}.\nMaterials assigned: ${u.r}${u.w?"; "+u.w:""}.\nUnit note: ${u.note}\nThis unit's vocabulary (${ws.length} words): ${ws.join("; ")||"(none listed)"}.\nWords she has already met in the deck (${known.length}): ${known.join(", ")||"(none yet)"}.\nGrammar she has met so far: ${t.units.slice(0,n).flatMap(x=>x.g).join("; ")}.\nWhen you write ${t.name} for her, stay within the grammar and vocabulary she has met, plus this unit's new material; a very few extra words are fine if glossed.`; }
/* generation, cached per unit */
async function gen(lang,n,what,force){ const u=ustate(lang,n); if(u.gen[what]&&!force) return u.gen[what]; const sys=unitSystem(lang,n); const L=track(lang).name; let user,max=2500,json=true; const I=intensity();
  if(what==="lesson"){ json=false; max=3500; user=`Teach this unit's grammar as a lesson I can read in ten minutes: ${I==="light"?"about 400 words":I==="deep"?"about 1000 words":"about 650 words"}. Start from what I already know, give each point with two or three ${L} examples (glossed), say where it will show up in this unit's reading, and end with three one-line things to watch for. Use markdown headings and short paragraphs; tables as markdown pipe tables where a paradigm helps. No preamble.`; }
  else if(what==="reading"){ max=4000; user=`Write a graded reading for this unit in ${L}, ${I==="light"?"80–120":I==="deep"?"220–320":"140–200"} words, using only the vocabulary and grammar I have met plus this unit's new words and grammar (which it should showcase). Make it a real story or scene with some life in it, set in the world of the unit's materials where that fits. Then gloss every word that is new to me or not in the deck. Return JSON only, with every line break inside a string written as \\n: {"title":"...","text":"...","gloss":[{"w":"word as it appears","m":"meaning and parse in a few words"}],"questions":["three comprehension questions in English"],"translation":"a plain English translation"}`; }
  else if(what==="exercises"){ max=3500; user=`Set ${I==="light"?"5":I==="deep"?"12":"8"} exercises for this unit, mixed: translate ${L} to English, translate English to ${L}, parse a form, change a form (e.g. make plural, make past), fill the blank with the right form. Keep them within what I know. Return JSON only: {"items":[{"type":"one of translate-from, translate-to, parse, transform, fill","prompt":"...","answer":"a model answer","note":"what the item is testing, one line"}]}`; }
  else if(what==="test"){ max=4000; user=`Set the unit test: ${I==="light"?"6":I==="deep"?"15":"10"} items covering this unit's grammar and vocabulary and, lightly, earlier units: translation both ways, parsing, forms, and one short ${L} passage of two or three sentences to translate. Return JSON only: {"items":[{"type":"...","prompt":"...","answer":"model answer","points":1}]}`; }
  else if(what==="compose"){ max=1200; user=`Set a short composition task in ${L} for this unit: ${I==="light"?"two or three sentences":I==="deep"?"a paragraph of 80–120 words":"four to six sentences"} on a concrete topic that uses this unit's grammar, with three hints (words or constructions she might want). Return JSON only: {"prompt":"...","hints":["...","...","..."]}`; }
  const out=await claude(sys,[{role:"user",content:user}],{json,max}); const r=shape(what,out); if(!r) throw new Error("SHAPE"); u.gen[what]=r; stamp(u); save(); return r; }
function strList(a){ return Array.isArray(a)?a.map(x=>typeof x==="string"?x:(x&&(x.text||x.q||x.prompt||JSON.stringify(x)))).filter(Boolean):[]; }
function shape(what,out){ if(what==="lesson") return typeof out==="string"&&out.trim().length>50?out:null;
  if(what==="reading"){ if(!out||typeof out.text!=="string"||!out.text.trim()) return null; return {title:String(out.title||"Reading"),text:out.text,gloss:(Array.isArray(out.gloss)?out.gloss:[]).filter(g=>g&&g.w).map(g=>({w:String(g.w),m:String(g.m||"")})),questions:strList(out.questions),translation:String(out.translation||"")}; }
  if(what==="exercises"||what==="test"){ const items=(out&&Array.isArray(out.items)?out.items:(Array.isArray(out)?out:[])).filter(x=>x&&x.prompt).map(x=>({type:String(x.type||""),prompt:String(x.prompt),answer:String(x.answer||""),note:String(x.note||""),points:+x.points||1})); return items.length?{items}:null; }
  if(what==="compose"){ if(!out||!out.prompt) return null; return {prompt:String(out.prompt),hints:strList(out.hints)}; }
  return out; }
/* marking */
async function markItems(lang,n,kind,items,answers){ const sys=unitSystem(lang,n); const L=track(lang).name;
  const user=`Mark these ${kind} answers. For each item give a score 0–${kind==="test"?"the item's points":"1"} (half marks allowed), a one- or two-line correction or comment in English (quote the right ${L} where she went wrong), and then an overall score out of 100 and three lines of overall feedback. Be fair, specific, and brief; a correct answer in different words is correct. Ignore accents${lang==="grc"&&!strictAccents()?" entirely (she is not yet being tested on them)":" only where she has merely omitted them"}, and ignore macrons.\n\n${items.map((it,i)=>`Item ${i+1} (${it.type}; ${it.points||1} pt): ${it.prompt}\nModel answer: ${it.answer}\nHer answer: ${answers[i]||"(blank)"}`).join("\n\n")}\n\nReturn JSON only: {"items":[{"score":0,"comment":"..."}],"score":0,"feedback":"...","strengths":["..."],"improvements":["..."]}`;
  const out=await claude(sys,[{role:"user",content:user}],{json:true,max:3000}); if(!out||!Array.isArray(out.items)) throw new Error("SHAPE");
  return {items:items.map((it,i)=>({score:+((out.items[i]||{}).score)||0,comment:String((out.items[i]||{}).comment||"")})),score:Math.max(0,Math.min(100,+out.score||0)),feedback:String(out.feedback||""),strengths:strList(out.strengths),improvements:strList(out.improvements),at:now()}; }
async function correctComposition(lang,n,prompt,text){ const sys=unitSystem(lang,n); const L=track(lang).name;
  const user=`Here is my ${L} composition for the task: "${prompt}".\n\n${text}\n\nCorrect it: give the corrected text in full (keep my sentences where they are right), then a numbered list of the errors with a one-line explanation each, then one thing I did well, then a score out of 100 for accuracy and idiom. Return JSON only, with line breaks inside strings as \\n: {"corrected":"...","notes":["..."],"praise":"...","score":0}`;
  const out=await claude(sys,[{role:"user",content:user}],{json:true,max:2500}); if(!out||!out.corrected) throw new Error("SHAPE"); return {corrected:String(out.corrected),notes:strList(out.notes),praise:String(out.praise||""),score:Math.max(0,Math.min(100,+out.score||0)),at:now()}; }
async function converse(lang,n,thread){ const sys=unitSystem(lang,n)+`\n\nYou are now conversing with her in ${track(lang).name}, in writing or by dictation. Stay at her level: use the grammar and words she has met, short sentences, and keep the conversation going with a question. If she writes in English, answer in ${track(lang).name} anyway, simply. Reply in JSON only: {"reply":"your reply in ${track(lang).name}, 1–3 sentences","gloss":"an English rendering of your reply","correction":"if her last message had errors, the corrected version with a few words of explanation in English; otherwise an empty string"}`;
  const out=await claude(sys,thread.slice(-14).map(m=>({role:m.role,content:m.content})),{json:true,max:800}); if(!out||!out.reply) throw new Error("SHAPE"); return {reply:String(out.reply),gloss:String(out.gloss||""),correction:String(out.correction||"")}; }
async function harvest(lang,n,text){ const sys=unitSystem(lang,n); const L=track(lang).name;
  const user=`From this ${L} text, list the words worth adding to my vocabulary deck: the ones not already in my deck and likely to recur. For each give the dictionary form (lemma${lang==="lat"?" with macrons":" with accents"}), the forms a dictionary gives (genitive and gender, or principal parts), a short meaning, and part of speech. At most 20. Return JSON only: {"words":[{"lemma":"...","forms":"...","meaning":"...","pos":"n|v|adj|adv|prep|conj|pron|part"}]}\n\n${text}`;
  const out=await claude(sys,[{role:"user",content:user}],{json:true,max:2500}); if(!out||!Array.isArray(out.words)) throw new Error("SHAPE"); return out.words.filter(w=>w&&w.lemma&&w.meaning).map(w=>({lemma:String(w.lemma),forms:String(w.forms||""),meaning:String(w.meaning),pos:String(w.pos||"")})); }
async function glossWord(lang,n,word,context){ const sys=unitSystem(lang,n); const out=await claude(sys,[{role:"user",content:`Gloss the word "${word}" as it occurs in: "${context}". Return JSON only: {"lemma":"dictionary form","parse":"the form's parse in a few words","meaning":"meaning here"}`}],{json:true,max:300}); if(!out||!out.meaning) throw new Error("SHAPE"); return out; }

/* ---------- shared view bits ---------- */
let CUR=null, TAB="overview", LASTUNIT=null;
function accentFor(lang){ document.documentElement.style.setProperty("--accent",lang?COLORS[lang]:"var(--blue)"); }
function bar(crumb,lang){ accentFor(lang); const due=TRACKS.reduce((a,t)=>a+deckStats(t.id).due,0); $("#bar").innerHTML=`<span class="mark ${lang==="grc"?"circle":""}"></span><span class="crumb">${crumb}</span><button data-go="/">Home</button>${TRACKS.map(t=>`<button data-go="/t/${t.id}" ${lang===t.id?'style="color:var(--ink)"':""}>${t.adj}</button>`).join("")}<button data-go="/review" title="Cards due">Review${due?` <b>${due}</b>`:""}</button><button data-go="/settings">Settings</button><span id="syncdot" class="syncdot ${SYNCSTATE.status}" title="${esc(SYNCSTATE.msg||SYNCSTATE.status)}"></span>`; $$("#bar button[data-go]").forEach(b=>b.onclick=()=>nav(b.dataset.go));
  const r=ROUTE; const on=p=>r===p||r.startsWith(p+"/")?"on":""; $("#bnav").innerHTML=`<button data-go="/" class="${r==="/"?"on":""}"><em></em>Home</button>${TRACKS.map(t=>`<button data-go="/t/${t.id}" class="${on("/t/"+t.id)}"><em></em>${t.adj}</button>`).join("")}<button data-go="/review" class="${on("/review")}"><em></em>Review${due?` <i class="pill">${due}</i>`:""}</button><button data-go="/settings" class="${on("/settings")}"><em></em>Settings</button>`; $$("#bnav button[data-go]").forEach(b=>b.onclick=()=>nav(b.dataset.go)); }
function splitSemi(str){ const out=[]; let d=0,cur=""; for(const ch of String(str||"")){ if(ch==="(") d++; else if(ch===")") d=Math.max(0,d-1); if(ch===";"&&d===0){ out.push(cur); cur=""; } else cur+=ch; } out.push(cur); return out.map(x=>x.trim()).filter(Boolean); }
const MFIELDS=[["r","Read","square"],["w","Watch and listen","tri"],["x","Around it","diamond"]];
function unitItems(lang,n){ const u=unitOf(lang,n); const out=[]; MFIELDS.forEach(([f,l])=>{ splitSemi(u[f]).forEach((t,i)=>out.push({id:f+":"+i,field:f,text:t.replace(/^./,c=>c.toUpperCase())})); }); return out; }
function itemOn(st,it){ return !!(st.items&&st.items[it.id]); }
function mark(field,on,{size=18,part=false}={}){ const f=on?"var(--accent)":(part?"var(--paper-2)":"none"); const st=on?"var(--accent)":"var(--ink)"; const sh=field==="w"?`<polygon points="9,1.5 17,16.5 1,16.5" fill="${f}" stroke="${st}" stroke-width="1.4" stroke-linejoin="round"/>`:(field==="x"?`<polygon points="9,1.5 16.5,9 9,16.5 1.5,9" fill="${f}" stroke="${st}" stroke-width="1.4" stroke-linejoin="round"/>`:`<rect x="1.5" y="1.5" width="15" height="15" fill="${f}" stroke="${st}" stroke-width="1.4"/>`); return `<svg class="mk ${on?"on":""}" width="${size}" height="${size}" viewBox="0 0 18 18" aria-hidden="true">${sh}</svg>`; }

function linkQ(text){ let t=String(text).replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim(); const c=t.indexOf(":"); if(c>7&&c<90) t=t.slice(0,c); else t=t.split(/[—;]|, the |, and /)[0]; return t.replace(/^(the|a|an)\s+/i,"").replace(/\b(whole|excerpts?|read|listen|watch|online|video|documentary|chapters?\s*[\d–-]+|§§?\s*[\d–-]+|lessons?\s*[\d–-]+|books?\s*[\dIVX–-]+|exercises?\s*[\d–-]+|pp?\.\s*[\d–-]+|if you can .*$|any .*$)\b/gi," ").replace(/[,.;:]+\s*$/,"").replace(/\s+/g," ").trim().slice(0,70); }
function itemLinks(it,lang){ const t=it.text, q=linkQ(t), e=encodeURIComponent(q); const L=[]; const add=(l,u)=>{ if(!L.some(x=>x[0]===l)) L.push([l,u]); };
  if(/youtube|latinitium|scorpio martianus|ranieri|alpha with angela|satura lanx|polis|historia civilis|kings and generals|smarthistory|lecture|documentary|read aloud|read in meter|listen|video|podcast|episode/i.test(t)) add("Watch",YT+e);

  if(/latin library/i.test(t)) add("Latin Library",LL);
  if(/perseus/i.test(t)||(it.field==="r"&&/^(caesar|cicero|virgil|ovid|catullus|horace|livy|tacitus|sallust|seneca|pliny|plautus|terence|juvenal|martial|lucretius|augustine|homer|iliad|odyssey|plato|xenophon|thucydides|herodotus|lysias|demosthenes|euripides|sophocles|aeschylus|aristophanes|aristotle|sappho|pindar|lucian|plutarch|aesop|hesiod|theocritus|callimachus|longus|epictetus|marcus aurelius|isocrates|pausanias)/i.test(q))) add("Text",PERS+e);
  if(/internet archive|public domain|rouse|d'ooge|pharr|north and hillard|bradley|sidgwick|gildersleeve|white, first greek|jebb|leaf|smyth/i.test(t)) add("Archive",ARCH+e);
  if(/familia romana|roma aeterna|athenaze|colloquia|ørberg|balme|mastronarde|hansen|reading greek|wheelock|traupman|rico|loeb|commentary|edition|\bbook\b/i.test(t)&&it.field==="r") add("Find a copy",WC+e);

  if(it.field==="x"&&!L.length) add("Read",WIKI+e);

  return L.map(([l,u])=>`<a class="ql" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join(""); }
/* unit progress */
function unitDone(lang,n){ const st=tstate(lang).units[n]; if(!st) return false; const items=unitItems(lang,n).filter(x=>x.field==="r"); const readOk=items.every(x=>itemOn(st,x)); const v=unitVocabState(lang,n); const vocOk=!doing("vocab")||v.n===0||v.intro===v.n; const exOk=!doing("exercises")||st.skip.exercises||typeof st.ex.score==="number"; const tOk=!doing("test")||st.skip.test||typeof st.test.score==="number"; return readOk&&vocOk&&exOk&&tOk; }
function unitsDone(lang){ let n=0; for(let i=1;i<=60;i++) if(unitDone(lang,i)) n++; return n; }
function nextUnit(lang){ for(let i=1;i<=60;i++) if(!unitDone(lang,i)) return i; return 60; }
function furthestUnit(lang){ const t=tstate(lang); let m=1; Object.keys(t.units).forEach(k=>{ const u=t.units[k]; if(u&&(u._t||0)>0) m=Math.max(m,+k); }); return Math.max(m,nextUnit(lang)); }

  if(!RV||RV.lang!==lang||RV.unit!==unit||RV.done){ const q=buildSession(lang,{unit:unit||null}); RV={lang,unit,q,i:0,right:0,wrong:0,done:false,shown:false,dir:null}; }
  const app=$("#app"); if(!RV.q.length){ const d=deckStats(lang); app.innerHTML=`<div class="lead"><div class="k"><a href="#/t/${lang}">← ${esc(t.name)}</a></div><h1>Nothing due</h1><div class="sub">${d.intro} words met, ${d.known} known. ${unit?"This unit's words are all in the deck.":"Come back when the cards fall due, or learn a unit's new words from its Vocabulary tab."}</div></div><div class="row" style="gap:8px;margin-top:16px"><a class="btn ghost" href="#/t/${lang}/vocab">Browse the deck</a>${TRACKS.filter(x=>x.id!==lang).map(x=>`<a class="btn ghost" href="#/review/${x.id}">${esc(x.adj)} cards${deckStats(x.id).due?" · "+deckStats(x.id).due:""}</a>`).join("")}</div>`; return; }
  if(RV.i>=RV.q.length){ RV.done=true; logMinutes(lang,Math.min(15,RV.q.length*0.3)); app.innerHTML=`<div class="lead"><div class="k"><a href="#/t/${lang}">← ${esc(t.name)}</a></div><h1>Done</h1><div class="sub">${RV.q.length} cards · ${RV.right} right first time · ${RV.wrong} to see again${RV.wrong?" (they come back in ten minutes)":""}.</div></div><div class="row" style="gap:8px;margin-top:16px"><a class="btn primary" href="#/review/${lang}">Again${deckStats(lang).due?" · "+deckStats(lang).due+" due":""}</a><a class="btn ghost" href="#/t/${lang}/u/${unit||nextUnit(lang)}">Back to the unit</a></div>`; return; }
  const item=RV.q[RV.i]; const w=wordById(lang,item.id); if(!w){ RV.i++; return renderReview(lang,unit); } const c=card(lang,item.id); if(!RV.dir) RV.dir=item.isNew?"rec":(Math.random()<0.5?"rec":"prod"); const rec=RV.dir==="rec";
  app.innerHTML=`<div class="lead" style="margin-bottom:10px"><div class="k"><a href="#/t/${lang}">← ${esc(t.name)}</a> · card ${RV.i+1} of ${RV.q.length}${item.isNew?" · new":""}</div></div><div class="prog2"><i style="width:${Math.round(100*RV.i/RV.q.length)}%"></i></div>
  <div class="card"><div class="dir">${item.isNew?"New word · learn it, then rate":(rec?"What does it mean?":"Give the "+t.adj)}</div><div class="q ${rec||item.isNew?cls:""}">${esc(rec||item.isNew?w.lemma:w.meaning)}${rec||item.isNew?`<small>${esc(w.forms)}${w.pos?" · "+esc(POS[w.pos]||w.pos):""}</small>`:`<small>${esc(POS[w.pos]||w.pos||"")}${w.forms&&!rec?"":""}</small>`}</div>
  ${item.isNew?`<div class="a">${esc(w.meaning)}</div>`:(RV.shown?`<div class="a ${rec?"":cls}">${esc(rec?w.meaning:w.lemma)}${rec?"":`<small style="display:block;font-family:var(--font);font-size:13px;color:var(--ink-3)">${esc(w.forms)}</small>`}</div><div class="${RV.ok?"ok":"no"}" style="font-size:13px;letter-spacing:.06em;text-transform:uppercase">${RV.ok?"right":"not quite"}${RV.typed?` · you wrote “${esc(RV.typed)}”`:""}</div>`:`<input id="ans" class="${rec?"":cls}" placeholder="${rec?"meaning":"type it"}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`)}
  ${item.isNew||RV.shown?`<div class="rate">${[["1","Again"],["3","Hard"],["4","Good"],["5","Easy"]].map(([q,l])=>`<button data-q="${q}" class="${(RV.shown&&!item.isNew)?((RV.ok&&q==="4")||(!RV.ok&&q==="1")?"on":""):(q==="4"?"on":"")}">${l}</button>`).join("")}</div>`:`<div class="rate"><button id="chk">Check</button><button id="show">Show</button></div>${!rec&&lang==="grc"?greekKeyboard():""}`}
  </div><p class="hint" style="margin-top:10px;text-align:center">${item.isNew?"Say it aloud, then rate how it felt. Hard means it comes back sooner.":rec?"Any one of the listed meanings counts.":(lang==="lat"?"Macrons are optional; j/v and i/u are equal.":(strictAccents()?"Accents count (Settings).":"Accents are optional for now (Settings)."))}</p>`;
  const inp=$("#ans"); if(inp){ inp.focus(); if(lang==="grc") bindKeyboard(app,inp); const check=()=>{ RV.typed=inp.value.trim(); RV.ok=rec?checkMeaning(RV.typed,w):checkLemma(RV.typed,w,lang); RV.shown=true; renderReview(lang,unit); }; inp.onkeydown=e=>{ if(e.key==="Enter") check(); }; $("#chk").onclick=check; $("#show").onclick=()=>{ RV.typed=inp.value.trim(); RV.ok=false; RV.shown=true; renderReview(lang,unit); }; }
  $$("[data-q]").forEach(b=>b.onclick=()=>{ const q=+b.dataset.q; if(item.isNew) introduce(lang,item.id); rate(lang,item.id,q); if(q<3){ RV.wrong++; RV.q.push({id:item.id,isNew:false}); } else RV.right++; RV.i++; RV.shown=false; RV.dir=null; RV.typed=""; renderReview(lang,unit); });
  document.onkeydown=e=>{ if(!$$("[data-q]").length) return; const m={"1":"1","2":"3","3":"4","4":"5"," ":"4"}[e.key]; if(m&&!/input|textarea/i.test(e.target.tagName)){ e.preventDefault(); const b=$(`[data-q="${m}"]`); if(b) b.click(); } }; }

  const vq=$("#vq"); vq.oninput=()=>{ S.ui=S.ui||{}; S.ui.vq=vq.value; clearTimeout(vq._t); vq._t=setTimeout(()=>{ renderVocab(lang); $("#vq").focus(); },300); }; }

function renderGrammar(lang){ const t=track(lang); bar(`${esc(t.adj)} · <b>Grammar</b>`,lang); CUR=null; setTick(lang); const cls=lang==="grc"?"grc":"la"; const ps=paradigms(lang); const fu=furthestUnit(lang); const kinds=[["noun","Nouns"],["adj","Adjectives and participles"],["pron","Pronouns"],["verb","Verbs"]];
  $("#app").innerHTML=trackPage(lang,"grammar",`<div class="lead"><h1>Grammar</h1><div class="sub">${ps.length} tables. Each unlocks with its unit; all of them are here to look at any time. Drill accuracy, last 30 days: ${drillAccuracy(lang)==null?"—":drillAccuracy(lang)+"%"}.</div></div><div class="row" style="gap:8px;flex-wrap:wrap;margin-top:12px"><a class="btn primary" href="#/t/${lang}/drill/${fu}">Drill what you have met</a><a class="btn ghost" href="#/t/${lang}/drill/60">Drill everything</a></div>
  ${kinds.map(([k,l])=>`<div class="sec" style="margin-top:22px"><h3>${l}</h3>${ps.filter(p=>p.kind===k).map(p=>`<details class="ver"><summary><b class="${cls}" style="font-family:var(--serif);font-size:17px">${esc(p.name)}</b> <span class="hint">· unit ${p.unit||1}${(p.unit||1)>fu?" · ahead":""} · ${esc(p.note)}</span></summary><div style="margin-top:8px">${paradigmHTML(p,lang)}</div><div class="row" style="margin-top:8px"><a class="btn ghost small" href="#/t/${lang}/drill/60/${p.id}">Drill this table</a></div></details>`).join("")}</div>`).join("")}`); }
let DR=null;
function renderDrill(lang,maxUnit,only){ const t=track(lang); bar(`${esc(t.adj)} · <b>Drill</b>`,lang); CUR=null; setTick(lang); document.body.classList.remove("hasrail"); const cls=lang==="grc"?"grc":"la"; maxUnit=+maxUnit||furthestUnit(lang);
  const scope=only==="new"?paradigms(lang).filter(p=>p.unit===maxUnit).map(p=>p.id):(only?[only]:drillScope(lang,maxUnit).map(p=>p.id)); const key=lang+"|"+maxUnit+"|"+(only||"");
  if(!DR||DR.key!==key||DR.done){ DR={key,lang,items:buildDrill(lang,scope,10),i:0,right:0,done:false,shown:false,sel:null}; }
  const app=$("#app"); if(!DR.items.length){ app.innerHTML=`<div class="lead"><div class="k"><a href="#/t/${lang}/grammar">← Grammar</a></div><h1>Nothing to drill yet</h1><div class="sub">No tables in this scope.</div></div>`; return; }
  if(DR.i>=DR.items.length){ DR.done=true; logDrill(lang,{n:DR.items.length,correct:DR.right,scope:only||("to unit "+maxUnit)}); logMinutes(lang,4); app.innerHTML=`<div class="lead"><div class="k"><a href="#/t/${lang}/grammar">← Grammar</a></div><h1>${DR.right} of ${DR.items.length}</h1><div class="sub">${DR.right===DR.items.length?"All of them. Again, faster?":DR.right>=7?"Good. The ones you missed are the ones to look at.":"Look at the tables again, then come back."}</div></div><div class="row" style="gap:8px;margin-top:16px"><a class="btn primary" href="#/t/${lang}/drill/${maxUnit}${only?"/"+only:""}" id="again">Again</a><a class="btn ghost" href="#/t/${lang}/grammar">The tables</a></div>`; $("#again").onclick=e=>{ e.preventDefault(); DR=null; renderDrill(lang,maxUnit,only); }; return; }
  const it=DR.items[DR.i];
  app.innerHTML=`<div class="lead" style="margin-bottom:10px"><div class="k"><a href="#/t/${lang}/grammar">← Grammar</a> · ${DR.i+1} of ${DR.items.length} · ${DR.right} right</div></div><div class="prog2"><i style="width:${Math.round(100*DR.i/DR.items.length)}%"></i></div>
  <div class="drill"><div class="q">${it.prompt}</div>${it.type==="parse"?`<div class="f ${cls}">${esc(it.form)}</div><div class="opts">${it.options.map(o=>`<button data-o="${esc(o)}" class="${DR.shown?(it.correct.includes(o)?"y":(DR.sel===o?"n":"")):""}">${esc(o)}</button>`).join("")}</div>`:`${DR.shown?`<div class="f ${cls}">${esc(it.answer)}</div><div class="${DR.ok?"ok":"no"}" style="font-size:13px;letter-spacing:.06em;text-transform:uppercase">${DR.ok?"right":"not quite"}${DR.typed?` · you wrote “${esc(DR.typed)}”`:""}</div>${it.labels.length>1?`<p class="hint">Also the ${it.labels.filter(l=>!it.prompt.includes(l)).map(esc).join(", ")}.</p>`:""}`:`<input id="ans" class="${cls}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type the form"><div class="rate"><button id="chk">Check</button><button id="show">Show</button></div>${lang==="grc"?greekKeyboard():""}`}`}
  ${DR.shown?`<div class="rate"><button id="next">Next</button><a class="minb" href="#/t/${lang}/grammar" style="margin-left:10px">See the table</a></div>`:""}</div>`;
  const inp=$("#ans"); if(inp){ inp.focus(); if(lang==="grc") bindKeyboard(app,inp); const check=()=>{ DR.typed=inp.value.trim(); DR.ok=it.alts.some(a=>sameForm(DR.typed,a,lang))||sameForm(DR.typed,it.answer,lang); DR.shown=true; if(DR.ok) DR.right++; renderDrill(lang,maxUnit,only); }; inp.onkeydown=e=>{ if(e.key==="Enter") check(); }; $("#chk").onclick=check; $("#show").onclick=()=>{ DR.typed=inp.value.trim(); DR.ok=false; DR.shown=true; renderDrill(lang,maxUnit,only); }; }
  $$("[data-o]").forEach(b=>b.onclick=()=>{ if(DR.shown) return; DR.sel=b.dataset.o; DR.ok=it.correct.includes(DR.sel); if(DR.ok) DR.right++; DR.shown=true; renderDrill(lang,maxUnit,only); });
  if($("#next")) $("#next").onclick=()=>{ DR.i++; DR.shown=false; DR.sel=null; DR.typed=""; renderDrill(lang,maxUnit,only); };
  document.onkeydown=e=>{ if(e.key==="Enter"&&$("#next")&&!/input/i.test(e.target.tagName)) $("#next").click(); }; }

function renderReader(lang,id){ const t=track(lang); bar(`${esc(t.adj)} · <b>Reader</b>`,lang); CUR=null; setTick(lang); const cls=lang==="grc"?"grc":"la"; const texts=TEXTS.filter(x=>x.lang===lang); const saved=(tstate(lang).readings||[]).filter(r=>!r.del);

    $("#app").innerHTML=trackPage(lang,"reader",`<div class="lead"><div class="k"><a href="#/t/${lang}/reader">← Reader</a>${x.stage?` · stage ${x.stage}`:""}</div><h1 class="${cls}" style="font-family:var(--serif)">${esc(x.title)}</h1><div class="sub">${esc(x.src||"")}</div></div><div class="row" style="gap:8px;margin:12px 0">${listenBtn("rd",x.text,lang)}<button class="btn ghost small" id="harv">Harvest words</button><span class="status"></span></div>${readingHTML(x.text,lang,gl)}<div class="glossbox" id="gb"></div>${x.note?`<div class="note" style="margin-top:14px">${esc(x.note)}</div>`:""}${x.translation?`<details class="ver" style="margin-top:12px"><summary class="minb">Show the translation</summary><div class="prose" style="margin-top:8px">${esc(x.translation)}</div></details>`:""}<div class="sec" style="margin-top:18px"><h3>Glossary</h3><ul class="vlist">${gl.map(g=>`<li><span class="lem ${cls}">${esc(g.w)}</span><span class="mean">${esc(g.m)}</span><span></span></li>`).join("")}</ul></div>`);
    bindReading($("#app"),lang,furthestUnit(lang),gl); bindListen($("#app"),lang); $("#harv").onclick=async()=>{ try{ await withStatus($("#harv"),async()=>{ const ws=await harvest(lang,furthestUnit(lang),x.text); let k=0; ws.forEach(w=>{ if(!allWords(lang).some(z=>z.lemma===w.lemma)){ addCustomWord(lang,w); k++; } }); toast(k?`${k} words added.`:"Nothing new to add."); }); }catch(e){} }; return; }
  $("#app").innerHTML=trackPage(lang,"reader",`<div class="lead"><h1>Reader</h1><div class="sub">Real texts with glosses built in, your own pasted passages, and the tutor's readings. Tap any word for its meaning.</div></div>
  <div class="sec" style="margin-top:14px"><h3>The anthology</h3><div class="links">${texts.map(x=>`<a class="lk" href="#/t/${lang}/reader/${x.id}"><span class="${cls}">${esc(x.title)}</span><em>${esc(x.src)} · stage ${x.stage}</em></a>`).join("")}</div></div>
  <div class="sec"><h3>Paste a passage</h3><p class="hint">Anything in ${esc(t.name)}: a page of Ørberg, a Vulgate chapter, a line of Homer. It is saved here; tap words to gloss them with the tutor; harvest the vocabulary.</p><input id="pt" class="focus" placeholder="title or source" style="padding:8px;border:1px solid var(--rule);width:100%;margin:8px 0"><textarea class="ta ${cls}" id="px" placeholder="paste the text"></textarea><div class="row" style="margin-top:8px"><button class="btn primary small" id="savep">Save to the reader</button></div></div>
  ${saved.length?`<div class="sec"><h3>Your passages and the tutor's readings</h3><div class="links">${saved.slice().reverse().map(r=>`<a class="lk" href="#/t/${lang}/reader/${r.id}"><span class="${cls}">${esc(r.title)}</span><em>${esc(r.src||fmtDate(r.at))}</em></a>`).join("")}</div></div>`:""}`);
  $("#savep").onclick=()=>{ const txt=$("#px").value.trim(); if(!txt) return; const t2=tstate(lang); t2.readings=t2.readings||[]; t2.readings.push({id:"p"+now().toString(36),title:$("#pt").value.trim()||txt.slice(0,40)+"…",src:"pasted "+fmtDate(now()),text:txt,at:now(),_t:now()}); save(); renderReader(lang); }; }

function renderNotebook(lang){ const t=track(lang); bar(`${esc(t.adj)} · <b>Notebook</b>`,lang); CUR=null; setTick(lang); const cls=lang==="grc"?"grc":"la"; const ts=tstate(lang); const comps=[],convs=[],exs=[]; Object.keys(ts.units).forEach(k=>{ const u=ts.units[k]; if(u.comp&&typeof u.comp.score==="number") comps.push({n:+k,...u.comp}); if(u.conv&&u.conv.thread.length) convs.push({n:+k,thread:u.conv.thread}); ((u.convArchive)||[]).forEach(a=>convs.push({n:+k,thread:a.thread,archived:true})); if(typeof u.ex.score==="number") exs.push({n:+k,kind:"exercises",...u.ex}); if(typeof u.test.score==="number") exs.push({n:+k,kind:"test",...u.test}); });
  const drills=(ts.drills||[]).slice(-30).reverse();
  $("#app").innerHTML=trackPage(lang,"notebook",`<div class="lead"><h1>Notebook</h1><div class="sub">Everything you have written and said in ${esc(t.name)}, and how the drills have gone.</div></div>
  <div class="sec" style="margin-top:14px"><h3>Compositions</h3>${comps.length?comps.sort((a,b)=>b.at-a.at).map(c=>`<details class="ver"><summary><b>Unit ${c.n}</b> · ${Math.round(c.score)} / 100 · ${fmtDate(c.at)}</summary><div class="prose ${cls}" style="margin-top:8px;white-space:pre-wrap">${esc(c.corrected)}</div><ol class="hint" style="padding-left:18px;margin-top:6px">${(c.notes||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>`).join(""):`<p class="empty">None yet.</p>`}</div>
  <div class="sec"><h3>Conversations</h3>${convs.length?convs.map(c=>`<details class="ver"><summary><b>Unit ${c.n}</b> · ${Math.floor(c.thread.length/2)} turns${c.archived?" · archived":""}</summary><div class="conv" style="margin-top:8px">${c.thread.map(m=>`<div class="msg ${m.role==="user"?"me":"prof"}"><div class="who">${m.role==="user"?STUDENT:"Tutor"}</div><div class="${cls}">${esc(m.content)}</div>${m.correction?`<div class="corr">${esc(m.correction)}</div>`:""}</div>`).join("")}</div></details>`).join(""):`<p class="empty">None yet.</p>`}</div>
  <div class="sec"><h3>Marked work</h3>${exs.length?`<table class="g"><thead><tr><th>Unit</th><th>What</th><th class="r">Score</th><th class="r">When</th></tr></thead><tbody>${exs.sort((a,b)=>b.at-a.at).map(e=>`<tr><td><a href="#/t/${lang}/u/${e.n}">${e.n}</a></td><td>${e.kind}</td><td class="r">${Math.round(e.score)}</td><td class="r">${fmtDate(e.at)}</td></tr>`).join("")}</tbody></table>`:`<p class="empty">None yet.</p>`}</div>
  <div class="sec"><h3>Drills</h3>${drills.length?`<table class="g"><thead><tr><th>Scope</th><th class="r">Right</th><th class="r">When</th></tr></thead><tbody>${drills.map(d=>`<tr><td>${esc(d.scope||"")}</td><td class="r">${d.correct} / ${d.n}</td><td class="r">${fmtDate(d.at)}</td></tr>`).join("")}</tbody></table>`:`<p class="empty">None yet.</p>`}</div>`); }
/* ---------- grades ---------- */
const WEIGHTS={exercises:.25,test:.30,compose:.20,grammar:.15,converse:.10};
function trackGrade(lang){ const ts=tstate(lang); const ex=[],te=[],co=[],cv=[]; Object.values(ts.units).forEach(u=>{ if(typeof u.ex.score==="number") ex.push(u.ex.score); if(typeof u.test.score==="number") te.push(u.test.score); if(u.comp&&typeof u.comp.score==="number") co.push(u.comp.score); const turns=(u.conv?u.conv.thread.filter(m=>m.role==="user").length:0)+((u.convArchive||[]).reduce((a,x)=>a+x.thread.filter(m=>m.role==="user").length,0)); if(turns) cv.push(Math.min(100,55+9*turns)); });
  const parts={exercises:avg(ex),test:avg(te),compose:avg(co),grammar:drillAccuracy(lang,60),converse:avg(cv)}; let num=0,den=0; Object.keys(parts).forEach(k=>{ if(!doing(k)) return; const v=parts[k]; if(typeof v==="number"){ num+=v*WEIGHTS[k]; den+=WEIGHTS[k]; } }); return {parts,overall:den?num/den:null}; }
function renderGrades(){ bar(`<b>Gradebook</b>`,null); CUR=null; setTick(null); document.body.classList.remove("hasrail"); const f=v=>v==null?"—":Math.round(v); const COLS=[["exercises","Exercises"],["test","Tests"],["compose","Composition"],["grammar","Drills"],["converse","Conversation"]].filter(([k])=>doing(k));
  $("#app").innerHTML=`<div class="lead"><div class="k"><a href="#/">← Home</a></div><h1>Gradebook</h1><div class="sub">Weights: ${COLS.map(([k,l])=>l.toLowerCase()+" "+Math.round(WEIGHTS[k]*100)).join(" · ")}; only what you are doing counts and the weights rescale. Nobody is counting but you.</div></div><div style="overflow-x:auto;margin-top:12px"><table class="g"><thead><tr><th>Track</th><th class="r">Units</th><th class="r">Words known</th>${COLS.map(([,l])=>`<th class="r">${l}</th>`).join("")}<th class="r">Grade</th></tr></thead><tbody>${TRACKS.map(t=>{ const g=trackGrade(t.id); const d=deckStats(t.id); return `<tr><td><a href="#/t/${t.id}">${esc(t.name)}</a></td><td class="r">${unitsDone(t.id)}/60</td><td class="r">${d.known}</td>${COLS.map(([k])=>`<td class="r">${f(g.parts[k])}</td>`).join("")}<td class="r"><b>${g.overall!=null?letter(g.overall)+" ("+Math.round(g.overall)+")":"—"}</b></td></tr>`; }).join("")}</tbody></table></div>`; }
/* ---------- study log ---------- */
function renderLog(){ bar(`<b>Study log</b>`,null); CUR=null; setTick(null); document.body.classList.remove("hasrail"); const days=26*7; const cells=[]; for(let i=days-1;i>=0;i--){ const k=dayKey(now()-i*DAY); const d=S.log[k]; const m=d?Object.keys(d).filter(x=>x!=="_t").reduce((a,x)=>a+d[x],0):0; cells.push(`<i class="${m>=60?"l4":m>=30?"l3":m>=10?"l2":m>0?"l1":""}" title="${k}: ${Math.round(m)} min"></i>`); }
  const per=TRACKS.map(t=>[t.name,Math.round(minutesTotal(t.id))]); const wk=[]; for(let w=0;w<8;w++){ let m=0; for(let i=0;i<7;i++){ const d=S.log[dayKey(now()-(w*7+i)*DAY)]; if(d) m+=Object.keys(d).filter(x=>x!=="_t").reduce((a,x)=>a+d[x],0); } wk.unshift(Math.round(m)); }
  $("#app").innerHTML=`<div class="lead"><div class="k"><a href="#/">← Home</a></div><h1>Study log</h1><div class="sub">Streak: ${streak()} days · ${per.map(([n,m])=>`${n} ${m>=120?Math.round(m/60)+" h":m+" min"}`).join(" · ")}. Time counts while the app is open and you are touching it; five minutes makes a day.</div></div><div class="sec" style="margin-top:16px"><h3>The last half year</h3><div class="heat">${cells.join("")}</div></div><div class="sec"><h3>Minutes a week, last eight weeks</h3><div class="statrow">${wk.map((m,i)=>`<div><b>${m}</b>${i===7?"this week":i===6?"last week":(7-i)+" weeks ago"}</div>`).join("")}</div></div>`; }
/* ---------- settings ---------- */
function renderSettings(){ bar(`<b>Settings</b>`,null); CUR=null; setTick(null); document.body.classList.remove("hasrail"); const own=k=>localStorage.getItem(k)||"";
  $("#app").innerHTML=`<div class="lead"><div class="k"><a href="#/">← Home</a></div><h1>Settings</h1></div><div class="settings">
  <div class="field"><label>Anthropic API key</label><input id="key" type="password" value="${esc(own(KEY))}" placeholder="${getKey()?"using The Seminar's key":"sk-ant-…"}"><div class="hint">Stored only in this browser. ${getKey()&&!own(KEY)?"The Seminar's key on this site is being borrowed; paste one here to use a different one.":"The tutor, readings, marking, and conversation run on it; the deck, the tables, and the drills work without it."}</div></div>
  <div class="field"><label>Model</label><select id="model">${MODELS.map(([v,l])=>`<option value="${v}" ${getModel()===v?"selected":""}>${l}</option>`).join("")}</select></div>
  <div class="field"><label>Build</label><div class="hint">${esc(BUILD)}. If a change you were sent is missing, close the app fully and reopen it.</div></div>
  <div class="field"><label>Text size</label><div class="row" style="margin-top:4px"><span class="gm">${[[88,"Smaller"],[100,"Normal"],[112,"Larger"],[125,"Largest"]].map(([v,l])=>`<button data-tsz="${v}" class="${textSize()===v?"on":""}">${l}</button>`).join("")}</span></div></div>
  ${TRACKS.map(t=>`<div class="field"><label>${esc(t.name)} pronunciation</label><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:4px">${t.pron.map(([v,l,d])=>`<button class="pill ${pron(t.id)===v?"on":""}" data-pron="${t.id}:${v}" title="${esc(d)}">${esc(l)}</button>`).join("")}</div><div class="hint">${esc(t.pron.find(p=>p[0]===pron(t.id))[2])}</div></div>`).join("")}
  <div class="field"><label>Greek accents in answers</label><div class="row" style="margin-top:4px"><span class="gm"><button data-acc="0" class="${strictAccents()?"":"on"}">optional</button><button data-acc="1" class="${strictAccents()?"on":""}">required</button></span></div><div class="hint">Optional at first: a correct word with a wrong or missing accent still counts in the deck and the drills. Switch to required in the second year.</div></div>
  <div class="field"><label>Intensity</label><div class="row" style="margin-top:4px">${intToggle("itS")}</div><div class="hint">Sets how long and how hard the tutor's lessons, readings, exercises, tests, and compositions are, and how strictly they are marked. The same switch sits on the Exercises and Composition tabs.</div></div>
  <div class="field"><label>What counts</label><div class="hint" style="margin-bottom:8px">Untick anything you would rather not do: it leaves the unit tabs and the gradebook, and a unit counts as finished without it. You can also skip the exercises or the test for one unit from its tab.</div><div class="optgrid">${PARTS.map(([id,l])=>`<label><input type="checkbox" data-doing="${id}" ${doing(id)?"checked":""}> <span>${l}</span></label>`).join("")}</div></div>
  <div class="field"><label>A preface</label><textarea class="ta small" id="pref" placeholder="${esc(PREFACE)}">${esc((S.ui&&S.ui.preface)||"")}</textarea><div class="hint">The short text at the top of Home. Blank for the default.</div></div>
  <div class="field"><label>Dictation engine (optional)</label><input id="oakey" type="password" value="${esc(own(OAKEY))}" placeholder="${oaKey()?"using The Seminar's key":"sk-… (OpenAI)"}"><div class="hint">With an OpenAI key, Dictate records your voice and transcribes it through Whisper, which can take Latin and Greek; without one, the browser's own dictation is used (Italian for Latin, modern Greek for Greek: rough, but workable for conversation).</div></div>
  <div class="row" style="gap:8px;margin-top:6px"><button class="btn primary" id="save">Save</button><button class="btn ghost" id="test">Test connection</button><span class="status" id="s"></span></div>
  <div class="sec" style="margin-top:28px"><h3>Sync between devices</h3><div class="field"><label>GitHub token (gist scope)</label><input id="gh" type="password" value="${esc(own(GHKEY))}" placeholder="${ghToken()?"using The Seminar's token":"github_pat_… or ghp_…"}"><div class="hint">Your deck, progress, and notebook are saved to a private gist in your GitHub account (a separate file from The Seminar's), so phone and laptop share one state. Paste the same token on each device.</div></div><div class="row" style="gap:8px"><button class="btn primary" id="ghsave">Save and sync now</button><button class="btn ghost" id="ghoff" ${ghToken()?"":"disabled"}>Disconnect</button><span class="status" id="ghs"></span></div></div>
  <div class="sec" style="margin-top:28px"><h3>Backup</h3><div class="row" style="gap:8px"><button class="btn ghost" id="exp">Export everything</button><button class="btn ghost" id="imp">Import a backup</button><input type="file" id="impf" accept="application/json" style="display:none"></div><div class="hint" style="margin-top:6px">A JSON file of the whole state. Import merges, newest wins.</div></div></div>`;
  $$("[data-tsz]").forEach(b=>b.onclick=()=>{ S.ui=S.ui||{}; S.ui.textSize=+b.dataset.tsz; S.ui._t=now(); save(); applyTextSize(); renderSettings(); });
  $$("[data-pron]").forEach(b=>b.onclick=()=>{ const [l,v]=b.dataset.pron.split(":"); setPron(l,v); renderSettings(); });
  $$("[data-acc]").forEach(b=>b.onclick=()=>{ S.ui=S.ui||{}; S.ui.strictAccents=b.dataset.acc==="1"; S.ui._t=now(); save(); renderSettings(); });
  bindInt(document,()=>renderSettings()); $$("[data-doing]").forEach(cb=>cb.onchange=()=>setDoing(cb.dataset.doing,cb.checked));
  $("#save").onclick=()=>{ const k=$("#key").value.trim(); if(k) localStorage.setItem(KEY,k); else localStorage.removeItem(KEY); localStorage.setItem(MODELKEY,$("#model").value); const o=$("#oakey").value.trim(); if(o) localStorage.setItem(OAKEY,o); else localStorage.removeItem(OAKEY); S.ui=S.ui||{}; S.ui.preface=$("#pref").value.trim(); S.ui._t=now(); save(); toast("Saved."); };
  $("#test").onclick=async()=>{ const k=$("#key").value.trim(); if(k) localStorage.setItem(KEY,k); localStorage.setItem(MODELKEY,$("#model").value); try{ await withStatus($("#test"),async()=>{ const r=await claude("Reply with the single word: salvē.",[{role:"user",content:"Test."}],{max:20}); $("#s").innerHTML=`<span class="ok">Connected: ${esc(r.trim())}</span>`; }); $("#test").disabled=false; }catch(e){} };
  $("#ghsave").onclick=async()=>{ const t=$("#gh").value.trim(); if(t) localStorage.setItem(GHKEY,t); else localStorage.removeItem(GHKEY); $("#ghs").innerHTML='<span class="spin"></span>'; await syncNow(); $("#ghs").innerHTML=SYNCSTATE.status==="ok"?`<span class="ok">${esc(SYNCSTATE.msg)}</span>`:`<span class="err">${esc(SYNCSTATE.msg)}</span>`; };
  $("#ghoff").onclick=()=>{ localStorage.removeItem(GHKEY); localStorage.removeItem(GISTKEY); setSync("off",""); renderSettings(); };
  $("#exp").onclick=()=>download("lingua-backup-"+dayKey()+".json",JSON.stringify(S,null,1),"application/json"); $("#imp").onclick=()=>$("#impf").click(); $("#impf").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); mergeInto(S,j); delete S._changed; save(); toast("Imported."); renderSettings(); }catch(err){ toast("That file could not be read."); } }; }
/* ---------- the tutor's office (drawer) ---------- */
let MODE="explain";
const MODES={explain:"Explain clearly and directly in English with examples in the language, 120–300 words; then ask one question to check she followed.",drill:"Set her one quick item at a time (a form to give, a short sentence to translate, a word to parse), check her answer, explain the miss in two lines, and set the next; keep replies under 80 words.",speak:"Converse only in the language she is learning, at her level, in one or two short sentences, with an English gloss in brackets after each reply and a one-line correction of her last message if it needs one.",passage:"She will paste a passage. Read it with her: translate it sentence by sentence, point out the constructions she has met and the ones she has not, and gloss the hard words; then ask her one question about it. 200–400 words."};
function chatKey(){ return CUR?`${CUR.lang}:${CUR.n}`:"general"; }
function openDrawer(){ $("#drawer").classList.add("open"); $("#scrim").classList.add("on"); renderDrawer(); }
function closeDrawer(){ $("#drawer").classList.remove("open"); $("#scrim").classList.remove("on"); }
function renderDrawer(){ const d=$("#drawer"); const key=chatKey(); const thread=S.chat[key]=S.chat[key]||[]; const lang=CUR?CUR.lang:(ROUTE.match(/\/t\/(lat|grc)/)||[])[1]||"lat"; const ctx=CUR?`${track(lang).name} · Unit ${CUR.n}: ${unitOf(lang,CUR.n).t}`:`${track(lang).name} · office hours`; const cls=lang==="grc"?"grc":"la";
  d.innerHTML=`<div class="dh"><div><b>The tutor</b><small>${esc(ctx)}</small></div><div class="row"><button class="btn ghost small" id="clear">Clear</button><button class="btn ghost small" id="close">Close</button></div></div><div class="modes">${Object.keys(MODES).map(m=>`<button data-m="${m}" class="${MODE===m?"on":""}">${m}</button>`).join("")}</div>
  <div class="dm" id="dm">${thread.length?thread.map(m=>`<div class="msg ${m.role==="user"?"me":"prof"}"><div class="who">${m.role==="user"?STUDENT:"Tutor"}</div><div class="prose">${md(m.content)}</div></div>`).join(""):`<p class="empty">Ask anything: a form, a construction, why a sentence means what it means, what to read next. Drill mode sets quick items; speak mode converses in the language; passage mode reads a pasted text with you.</p>`}</div>
  <div class="di"><textarea id="din" class="${MODE==="speak"?cls:""}" placeholder="${MODE==="passage"?"Paste a passage and say what you want from it…":MODE==="speak"?(lang==="lat"?"Latīnē…":"Ἑλληνιστί…"):"Ask…"}"></textarea><button class="btn ghost small" id="dmic">Dictate</button><button class="btn primary" id="send">Send</button></div>`;
  $("#close",d).onclick=closeDrawer; $("#clear",d).onclick=()=>{ S.chat[key]=[]; save(); renderDrawer(); }; $$(".modes button",d).forEach(b=>b.onclick=()=>{ MODE=b.dataset.m; renderDrawer(); }); const dm=$("#dm",d); dm.scrollTop=dm.scrollHeight; setupMic($("#dmic",d),$("#din",d),()=>{},MODE==="speak"?lang:"en");
  const send=async()=>{ const ta=$("#din",d); const t=ta.value.trim(); if(!t) return; thread.push({role:"user",content:t}); save(); ta.value=""; renderDrawer(); const dm2=$("#dm",d); dm2.insertAdjacentHTML("beforeend",'<div class="msg prof"><span class="spin"></span></div>'); dm2.scrollTop=dm2.scrollHeight;
    try{ const sys=(CUR?unitSystem(lang,CUR.n):baseSystem(lang)+`\n\nShe may ask about any unit of the course; the furthest unit she has reached is ${furthestUnit(lang)}.`)+`\n\nThis is office hours, in writing. Mode: ${MODES[MODE]}`; const reply=await claude(sys,thread.slice(-16).map(m=>({role:m.role,content:m.content})),{max:1200}); thread.push({role:"assistant",content:reply}); save(); renderDrawer(); }
    catch(e){ thread.pop(); save(); renderDrawer(); $("#dm",d).insertAdjacentHTML("beforeend",`<div class="err">${esc(errMsg(e))}</div>`); } };
  $("#send",d).onclick=send; $("#din",d).onkeydown=e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)) send(); }; }
$("#fab").onclick=openDrawer; $("#scrim").onclick=closeDrawer; $("#fab").textContent="Tutor";
/* ---------- router ---------- */
function route(){ document.body.classList.remove("hasrail"); document.onkeydown=null; const h=ROUTE; const p=h.split("/").filter(Boolean); closeDrawer(); try{ routeInner(p); }catch(e){ console.error(e); $("#app").innerHTML=`<div class="lead"><h1>Something went wrong</h1><div class="sub">${esc(e.message)}</div><div class="row" style="margin-top:12px"><a class="btn ghost" href="#/">Home</a></div></div>`; } growAll(); }
function routeInner(p){ if(!p.length) return renderHome(); if(p[0]==="settings") return renderSettings(); if(p[0]==="grades") return renderGrades(); if(p[0]==="log") return renderLog(); if(p[0]==="review") return renderReview(p[1],p[2]?+p[2]:undefined);
  if(p[0]==="t"&&track(p[1])){ const lang=p[1]; if(!p[2]) return renderTrack(lang); if(p[2]==="u") return renderUnit(lang,+p[3]||1); if(p[2]==="vocab") return renderVocab(lang); if(p[2]==="grammar") return renderGrammar(lang); if(p[2]==="drill") return renderDrill(lang,p[3],p[4]); if(p[2]==="reader") return renderReader(lang,p[3]); if(p[2]==="notebook") return renderNotebook(lang); }
  return renderHome(); }
document.addEventListener("keydown",e=>{ const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select"||e.metaKey||e.ctrlKey||e.altKey) return; if(e.key==="t"||e.key==="T"){ openDrawer(); return; } if(e.key==="Escape"){ closeDrawer(); return; } if(!CUR) return; const tabs=unitTabs(); if(e.key==="ArrowLeft"&&CUR.n>1) nav(`/t/${CUR.lang}/u/${CUR.n-1}`); else if(e.key==="ArrowRight"&&CUR.n<60) nav(`/t/${CUR.lang}/u/${CUR.n+1}`); else if(/^[1-9]$/.test(e.key)&&tabs[+e.key-1]){ TAB=tabs[+e.key-1][0]; renderUnit(CUR.lang,CUR.n); } });
/* ---------- boot ---------- */
window.LINGUA={state:()=>S,nav,tracks:TRACKS,allWords,deckStats,unitDone,buildDrill,paradigms,checkMeaning,checkLemma,sameForm,trackGrade,unitItems};
applyTextSize(); route(); if(ghToken()) syncNow(); if(canSpeak()){ try{ speechSynthesis.getVoices(); }catch(e){} }

})();
</script>
